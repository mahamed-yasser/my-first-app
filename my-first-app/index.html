<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المهام والملاحظات | Task & Notes App</title>
    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-list-check"></i>
                <h1>مهامي وملاحظاتي</h1>
            </div>
            <p class="subtitle">نظم يومك بإنتاجية وسهولة</p>
        </header>

        <!-- Stats Counter -->
        <section class="stats-section">
            <div class="stat-card">
                <div class="stat-icon total"><i class="fa-solid fa-tasks"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="total-tasks-count">0</span>
                    <span class="stat-label">إجمالي المهام</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon completed"><i class="fa-solid fa-circle-check"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="completed-tasks-count">0</span>
                    <span class="stat-label">المهام المكتملة</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon pending"><i class="fa-solid fa-clock"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="pending-tasks-count">0</span>
                    <span class="stat-label">قيد الانتظار</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon notes"><i class="fa-solid fa-note-sticky"></i></div>
                <div class="stat-info">
                    <span class="stat-value" id="total-notes-count">0</span>
                    <span class="stat-label">الملاحظات</span>
                </div>
            </div>
        </section>

        <!-- Controls: Search & Tabs -->
        <section class="controls-section">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="ابحث في المهام والملاحظات...">
                <button type="button" id="clear-search-btn" class="clear-btn hidden"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="view-tabs">
                <button class="tab-btn active" data-tab="tasks-view">
                    <i class="fa-solid fa-list-ul"></i> المهام
                </button>
                <button class="tab-btn" data-tab="notes-view">
                    <i class="fa-solid fa-sticky-note"></i> الملاحظات
                </button>
            </div>
        </section>

        <!-- Main Content Area -->
        <main class="main-content" id="main-content">
            <!-- Tasks View -->
            <section id="tasks-view" class="view-content active-view">
                <!-- Task Creation Form -->
                <div class="card form-card">
                    <h2><i class="fa-solid fa-plus-circle"></i> إضافة مهمة جديدة</h2>
                    <form id="add-task-form">
                        <div class="form-row">
                            <input type="text" id="task-input" placeholder="ما هي مهمتك التالية؟" required>
                        </div>
                        <div class="form-options">
                            <div class="select-group">
                                <label for="task-category"><i class="fa-solid fa-tag"></i> التصنيف:</label>
                                <select id="task-category">
                                    <option value="عام">عام</option>
                                    <option value="عمل">عمل 💼</option>
                                    <option value="شخصي">شخصي 👤</option>
                                    <option value="دراسة">دراسة 📚</option>
                                    <option value="عاجل">عاجل 🚨</option>
                                </select>
                            </div>
                            <div class="select-group">
                                <label for="task-priority"><i class="fa-solid fa-flag"></i> الأولوية:</label>
                                <select id="task-priority">
                                    <option value="منخفضة">منخفضة</option>
                                    <option value="متوسطة" selected>متوسطة</option>
                                    <option value="عالية">عالية</option>
                                </select>
                            </div>
                            <div class="select-group">
                                <label for="task-due"><i class="fa-regular fa-calendar"></i> الموعد:</label>
                                <input type="date" id="task-due" class="date-input">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-plus"></i> إضافة المهمة
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Task Filters -->
                <div class="task-tools" role="group" aria-label="أدوات المهام">
                    <button type="button" class="tool-btn" id="clear-done-btn"><i class="fa-solid fa-broom"></i> مسح المكتملة</button>
                    <button type="button" class="tool-btn" id="export-btn"><i class="fa-solid fa-download"></i> تصدير</button>
                    <label class="tool-btn" for="import-file"><i class="fa-solid fa-upload"></i> استيراد</label>
                    <input type="file" id="import-file" accept="application/json" hidden>
                </div>
                <div class="task-filters">
                    <button class="filter-btn active" data-filter="all">الكل</button>
                    <button class="filter-btn" data-filter="pending">قيد الانتظار</button>
                    <button class="filter-btn" data-filter="completed">المكتملة</button>
                </div>

                <!-- Tasks List -->
                <ul id="tasks-list" class="tasks-list">
                    <!-- Dynamic tasks will be inserted here -->
                </ul>
                <div id="no-tasks-msg" class="empty-state hidden">
                    <i class="fa-regular fa-clipboard"></i>
                    <p>لا توجد مهام مطابقة</p>
                </div>
            </section>

            <!-- Notes View -->
            <section id="notes-view" class="view-content hidden-view">
                <!-- Note Creation Form -->
                <div class="card form-card">
                    <h2><i class="fa-solid fa-pen-to-square"></i> إضافة ملاحظة جديدة</h2>
                    <form id="add-note-form">
                        <div class="form-row">
                            <input type="text" id="note-title" placeholder="عنوان الملاحظة" required>
                        </div>
                        <div class="form-row">
                            <textarea id="note-content" placeholder="اكتب ملاحظتك هنا..." rows="3" required></textarea>
                        </div>
                        <div class="form-options">
                            <div class="color-picker-group">
                                <label><i class="fa-solid fa-palette"></i> لون الملاحظة:</label>
                                <div class="color-options">
                                    <label class="color-circle bg-blue active">
                                        <input type="radio" name="note-color" value="blue" checked>
                                    </label>
                                    <label class="color-circle bg-purple">
                                        <input type="radio" name="note-color" value="purple">
                                    </label>
                                    <label class="color-circle bg-emerald">
                                        <input type="radio" name="note-color" value="emerald">
                                    </label>
                                    <label class="color-circle bg-amber">
                                        <input type="radio" name="note-color" value="amber">
                                    </label>
                                    <label class="color-circle bg-rose">
                                        <input type="radio" name="note-color" value="rose">
                                    </label>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-secondary">
                                <i class="fa-solid fa-plus"></i> حفظ الملاحظة
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Notes Grid -->
                <div id="notes-grid" class="notes-grid">
                    <!-- Dynamic notes will be inserted here -->
                </div>
                <div id="no-notes-msg" class="empty-state hidden">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>لا توجد ملاحظات مطابقة</p>
                </div>
            </section>
        </main>

        <div id="toast" class="toast hidden">
            <span id="toast-message">تمت العملية بنجاح!</span>
        </div>

        <footer class="app-footer">
            <p>تطبيق إدارة المهام والملاحظات &copy; 2026 - جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
